apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: rh-telco-on-push
  namespace: ai5-marketplace-tenant
  labels:
    appstudio.openshift.io/application: telco-plugins
    appstudio.openshift.io/component: rh-telco
    pipelines.appstudio.openshift.io/type: build
    custom.appstudio.openshift.io/compass-publish: 'true'
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: (event == 'incoming' && target_branch == 'main') || (event == 'push' &&
      target_branch == 'main' && ("agentic-plugins/rh-telco/**".pathChanged() || "agentic-plugins/submissions/rh-telco/**".pathChanged()
      || ".tekton/rh-telco-push.yaml".pathChanged() || ".tekton/rh-telco-pull_request.yaml".pathChanged() || "agentic-plugins/scripts/**".pathChanged()
      || "agentic-plugins/containers/plugin/**".pathChanged() || "agentic-plugins/konflux/**".pathChanged() || "agentic-plugins/system.yaml".pathChanged()
      || "agentic-plugins/catalog-info.yaml".pathChanged() || "agentic-plugins/policy/**".pathChanged()))
    pipelinesascode.tekton.dev/cancel-in-progress: 'false'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
spec:
  pipelineRef:
    resolver: bundles
    params:
    - name: name
      value: plugin-component-build
    - name: bundle
      value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/pipeline-plugin-component-build:ffbffc7f163ea50a03737de076c1fc18fe8a95f5@sha256:5b617f15283e25766ac28278f48f2061cb666354ce54a582d83f969908dcd9b0
    - name: kind
      value: pipeline
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/telco-plugins/rh-telco:{{revision}}
  - name: plugin-id
    value: rh-telco
  - name: source-subdir
    value: agentic-plugins
  - name: dockerfile
    value: containers/plugin/Containerfile
  - name: tools-image
    value: quay.io/ecosystem-appeng/plugin-pipeline-tools:rh-sre-compass-catalog-5ce1e284a452@sha256:7c211bd4d04d58c82dd6ed6a0b98444edf0bd18d31ed4e6256fb6e60a4ee53ac
  - name: prepare-task-bundle
    value: quay.io/konflux-ci/tekton-catalog/task-run-script-oci-ta:0.1.3@sha256:e1b074b6c5818f17c1967581e94c1a45f051055196bcf3638d465362aa0b4936
  - name: evaluation-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-aeh-skill-eval:ffbffc7f163ea50a03737de076c1fc18fe8a95f5@sha256:d5ec03c5be716ad2f5717385ed5f880df5b1dd6f3018a42442df1a167c552c6f
  - name: label-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-check-pr-label:8a8d5ac9df34a006004189dea3158cd9a9a73559@sha256:dd3dabeb788ff749bf6ddd4e325700e377cb36a05b565201f9e744880c596c14
  - name: target-branch
    value: main
  - name: gitlab-server-url
    value: https://gitlab.cee.redhat.com
  - name: gitlab-project-path
    value: telco-ai-projects%2Fai-sandbox
  - name: gitlab-token-secret
    value: telco-ai-gitlab-secret
  - name: gitlab-ca-bundle-configmap
    value: trusted-ca
  - name: ca-bundle-configmap
    value: rh-telco-eval-trusted-ca
  - name: insecure-ssl
    value: 'false'
  - name: evaluation-image
    value: quay.io/ecosystem-appeng/agent-eval-harness:telco-glm-review-4ab84dc-runner@sha256:8cec3c84349cd7718f40fd7309093a0c4ff6d8269cd2c42732774c61fe562b29
  - name: trial-image
    value: quay.io/ecosystem-appeng/agent-eval-harness:telco-aeh-judge-13515ec-trial@sha256:d7005c4b4aa05c79013424abfe8f0bbab2f7c5cc04569d7271c9798627fe27f3
  - name: agent-api-base
    value: https://api.enmaas.devshift.net
  - name: llm-api-base
    value: https://api.enmaas.devshift.net/v1
  - name: llm-model
    value: rits/zai-org/glm-5-3
  - name: llm-secret
    value: rh-telco-enmaas-credentials
  - name: workload-credentials-secret
    value: rh-telco-enmaas-credentials
  - name: aeh-model-override
    value: anthropic/rits/zai-org/glm-5-3
  - name: aeh-judge-model-override
    value: anthropic:/rits/zai-org/glm-5-3
  - name: skill-review
    value: 'true'
  - name: submission-review
    value: 'on'
  # Konflux builds the GitLab mirror and reads evaluation labels from upstream GitHub PRs.
  - name: mirror-source
    value: https://github.com/openshift-kni/ai-sandbox
  - name: tiers
    value: auto
  - name: persist
    value: postgres
  - name: persistence-required
    value: 'true'
  - name: evidence-image
    value: quay.io/ecosystem-appeng/plugin-pipeline-tools:rh-sre-signed-scanner-v2-283147d94a3b@sha256:7d64437540d29d96256a115ba70ec60a3cfb5c408b6bbf70ee3c8bbb39937f76
  - name: verify-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-verify-plugin-evidence:62ad8f5ca3a3462502bda2a8c56e4697706c6985@sha256:00f6ef9c9c07bc63a4fe12cbd1fd78d092d0a05c87658cc716f651102984c368
  - name: compass-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-collect-plugin-context:25171e38e21dbc0f802363d8ba643a34089db678@sha256:377a22ff599b056ccdcf37a805cc12ae9696919a2c97e25126a50c6c5bfc9869
  - name: compass-url
    value: https://compass.stage.redhat.com
  - name: compass-secret
    value: plugin-pipeline-compass-sec
  - name: soundcheck-checks
    value: '{"plugin":[],"skill":[],"mcp":[]}'
  timeouts:
    pipeline: 24h
    tasks: 23h
    finally: 1h
  taskRunTemplate:
    serviceAccountName: build-pipeline-rh-telco
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  - name: shared-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
