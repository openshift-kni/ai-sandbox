apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: rh-telco-on-pull-request
  namespace: ai5-marketplace-tenant
  labels:
    appstudio.openshift.io/application: telco-plugins
    appstudio.openshift.io/component: rh-telco
    pipelines.appstudio.openshift.io/type: build
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: event == 'pull_request' && target_branch == 'main' && ("agentic-plugins/rh-telco/**".pathChanged()
      || "agentic-plugins/submissions/rh-telco/**".pathChanged() || ".tekton/rh-telco-push.yaml".pathChanged() || ".tekton/rh-telco-pull_request.yaml".pathChanged()
      || "agentic-plugins/scripts/**".pathChanged() || "agentic-plugins/containers/plugin/**".pathChanged() || "agentic-plugins/konflux/**".pathChanged()
      || "agentic-plugins/system.yaml".pathChanged() || "agentic-plugins/catalog-info.yaml".pathChanged() || "agentic-plugins/policy/**".pathChanged())
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
spec:
  pipelineRef:
    resolver: bundles
    params:
    - name: name
      value: plugin-component-build
    - name: bundle
      value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/pipeline-plugin-component-build:8e3c7d33fa7304452303c8e5314c1ddd1d60639e@sha256:07377ab345f215af127965d6fba4a0d9a3b00c12ed51f795c0c4c5d5f4a30770
    - name: kind
      value: pipeline
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/telco-plugins/rh-telco:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: plugin-id
    value: rh-telco
  - name: source-subdir
    value: agentic-plugins
  - name: dockerfile
    value: containers/plugin/Containerfile
  - name: tools-image
    value: quay.io/ecosystem-appeng/plugin-pipeline-tools:per-plugin-componnent-20261116-source-subdir-v1@sha256:bdf07289e1feea846ffc7ee29dd22fe359bb8d3db3b4077e9e2831a410c687c2
  - name: prepare-task-bundle
    value: quay.io/konflux-ci/tekton-catalog/task-run-script-oci-ta:0.1.3@sha256:e1b074b6c5818f17c1967581e94c1a45f051055196bcf3638d465362aa0b4936
  - name: evaluation-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-aeh-skill-eval:48f7b23e5148ea90098762fbe4a8e1549e6f7d8d@sha256:3e73e4e6b52b8cb00df5ea1051f6970c912feeae4ae4b2884dc17ebc7fc3f675
  - name: label-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-check-pr-label:c094475c897ad4db6f578895d485482530bda762@sha256:2b34828d641fb80027111453565f77c452051ba44a4aef6f121082da24933aad
  - name: target-branch
    value: main
  - name: gitlab-server-url
    value: https://gitlab.cee.redhat.com
  - name: gitlab-project-path
    value: telco-ai-projects%2Fai-sandbox
  - name: gitlab-token-secret
    value: telco-ai-gitlab-secret
  - name: gitlab-ca-bundle-configmap
    value: trusted-ca
  - name: ca-bundle-configmap
    value: trusted-ca
  - name: insecure-ssl
    value: 'true'
  - name: evaluation-image
    value: quay.io/ecosystem-appeng/agent-eval-harness:per-plugin-componnent-20261105-harness8@sha256:6e45ccc233515d50a832e18ef2e7ef6d33c9368653b10db6d0c2d69323bbca5f
  - name: trial-image
    value: quay.io/ecosystem-appeng/agent-eval-harness:v1.0.2-trial@sha256:374b28704de8562ae2d6130d84d8d33d99db7dfe9680315034b10db5308cc983
  - name: tiers
    value: '1'
  - name: persist
    value: ''
  - name: persistence-required
    value: 'true'
  - name: evidence-image
    value: quay.io/ecosystem-appeng/plugin-pipeline-tools:per-plugin-componnent-20261116-source-subdir-v1@sha256:bdf07289e1feea846ffc7ee29dd22fe359bb8d3db3b4077e9e2831a410c687c2
  - name: verify-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-verify-plugin-evidence:62ad8f5ca3a3462502bda2a8c56e4697706c6985@sha256:00f6ef9c9c07bc63a4fe12cbd1fd78d092d0a05c87658cc716f651102984c368
  - name: compass-task-bundle
    value: quay.io/redhat-user-workloads/ai5-marketplace-tenant/task-collect-plugin-context:25171e38e21dbc0f802363d8ba643a34089db678@sha256:377a22ff599b056ccdcf37a805cc12ae9696919a2c97e25126a50c6c5bfc9869
  - name: compass-url
    value: https://compass.stage.redhat.com
  - name: compass-secret
    value: plugin-pipeline-compass-sec
  - name: compass-token-key
    value: COMPASS_STAGE_TOKEN
  - name: soundcheck-checks
    value: '{"plugin":[],"skill":[],"mcp":[]}'
  timeouts:
    pipeline: 24h
    tasks: 23h
    finally: 1h
  taskRunTemplate:
    serviceAccountName: build-pipeline-rh-telco
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  - name: shared-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
