# GitLab webhook verification token.
#
# This manifest is a template. Create the secret using kubectl:
#   openssl rand -hex 20 > /tmp/webhook-token.txt
#   kubectl create secret generic rds-mr-webhook-secret \
#       -n openshift-lightspeed \
#       --from-file=token=/tmp/webhook-token.txt
#   rm /tmp/webhook-token.txt
#
# Configure the same token value in the GitLab project webhook settings.
apiVersion: v1
kind: Secret
metadata:
  name: rds-mr-webhook-secret
  namespace: openshift-lightspeed
type: Opaque
