# GitLab webhook verification token.
# Replace REPLACE_WEBHOOK_SECRET with a random string, then configure
# the same value in the GitLab project webhook settings.
#
# Generate: openssl rand -hex 20
apiVersion: v1
kind: Secret
metadata:
  name: rds-mr-webhook-secret
  namespace: openshift-lightspeed
type: Opaque
stringData:
  token: REPLACE_WEBHOOK_SECRET
