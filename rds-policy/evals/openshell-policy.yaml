# The agent and the grader both call the model gateway, whose host run.sh fills
# in from ANTHROPIC_BASE_URL. Gateways with a global policy lock apply their own
# policy instead of this file (`openshell policy get <sandbox>` shows which is
# in effect).
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /proc
  read_write:
    - /tmp
    - /dev

landlock:
  compatibility: best_effort

network_policies:
  model-gateway:
    name: model-gateway
    endpoints:
      - host: GATEWAY_HOST
        port: 443
        enforcement: enforce
    binaries:
      # Claude Code ships inside the pinned agent SDK; Promptfoo runs under node.
      - path: /tmp/**/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude
      - path: /usr/bin/node

  npm:
    name: npm-registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        enforcement: enforce
    binaries:
      - path: /usr/bin/node

  # `setup-openshell` pip-installs uv with the image's python3, then uv pulls
  # the project's dependencies.
  pypi:
    name: python-packages
    endpoints:
      - host: pypi.org
        port: 443
        enforcement: enforce
      - host: files.pythonhosted.org
        port: 443
        enforcement: enforce
    binaries:
      - path: /usr/bin/python3*
      - path: /tmp/.local/bin/uv

  # `uv python install` fetches CPython from GitHub release assets.
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        enforcement: enforce
      - host: release-assets.githubusercontent.com
        port: 443
        enforcement: enforce
      - host: objects.githubusercontent.com
        port: 443
        enforcement: enforce
    binaries:
      - path: /usr/bin/git
      - path: /usr/lib/git-core/**
      - path: /tmp/.local/bin/uv
