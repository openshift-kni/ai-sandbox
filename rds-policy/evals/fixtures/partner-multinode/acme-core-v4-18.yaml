apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: acme-core-v4-18
policyDefaults:
  namespace: ztp-acme-core-v4-18
  placement:
    labelSelector:
      cluster-version: "v4.18"
  remediationAction: enforce
  severity: low
policies:
- name: acme-mcp-policy
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "1"
  manifests:
    - path: custom-crs/mcp-worker-cnf.yaml
- name: acme-sub-policy
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "2"
  manifests:
    - path: source-crs/SubscriptionOCP.yaml
      patches:
      - spec:
          channel: "stable-4.18"
- name: acme-perf-policy
  policyAnnotations:
    ran.openshift.io/ztp-deploy-wave: "8"
  manifests:
    - path: source-crs/PerformanceProfile.yaml
      patches:
      - metadata:
          name: worker-cnf-profile
        spec:
          cpu:
            reserved: "0-1,32-33"
            isolated: "2-31,34-63"
          hugepages:
            pages:
            - count: 16
              size: 1G
          nodeSelector:
            node-role.kubernetes.io/worker-cnf: ""
