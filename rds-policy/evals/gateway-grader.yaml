# llm-rubric judge on the gateway the agent uses, for `make eval-gateway`.
# Assumes the gateway also serves the OpenAI API under /v1.
id: 'openai:chat:{{ env.RDS_GRADER_MODEL }}'
config:
  apiBaseUrl: '{{ env.ANTHROPIC_BASE_URL }}/v1'
  apiKeyEnvar: ANTHROPIC_API_KEY
  max_tokens: 4096
  # Open models can spend the whole budget on reasoning and return no verdict.
  passthrough:
    reasoning_effort: none
