apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  # QUESTION: We're calling the plugin rh-telco and the system
  # telco-agentic-plugins. Are those names OK? We'd like to settle them before
  # registering, because renaming later creates new entities in Compass and
  # leaves the old ones behind.
  name: rh-telco
  # QUESTION: Should the plugin and the skill use the
  # ai5-marketplace namespace, or should we have our own?
  namespace: ai5-marketplace
  title: Red Hat Telco
  description: >
    Skills for telco partners running OpenShift RAN and Core reference
    configurations, starting with Day 2 policy updates between OCP versions.
  labels:
    # QUESTION: Is external the right value while this is
    # still a POC?
    distribution: external
  tags:
    - ai-skill
    - telco
    - openshift
    - policygenerator
  annotations:
    # QUESTION: I tried `lola install -a claude-code`. Lola
    # copies hooks/ into .lola/modules/ but never registers the PostToolUse
    # hook, so it doesn't run. Does AI5 already handle plugin hooks somehow, or
    # should we add a lola.yaml post-install script that registers it?
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: rh-telco
    agentic.redhat.com/repository: https://github.com/openshift-kni/ai-sandbox
    agentic.redhat.com/path: agentic-plugins/rh-telco
    github.com/project-slug: openshift-kni/ai-sandbox
  links:
    - url: https://github.com/openshift-kni/ai-sandbox
      title: Source Repository
      icon: github
spec:
  # QUESTION: We left out AGENTS.md because the plugin has a
  # single skill, and the skill's description already decides when it
  # triggers. Is one needed now for the catalog or for Lola
  # (--append-context), or can we add it once we have a second skill?
  type: plugin
  lifecycle: beta
  # QUESTION: Should we create our own owner group, or stay
  # under group:redhat/ai5-marketplace? The same answer applies to
  # system.yaml and the skill.
  owner: group:redhat/ai5-marketplace
  system: default/telco-agentic-plugins
  disciplines:
    - telco
    - devops
  categories:
    - configuration-management
    - upgrades
  agents: []
  dependsOn:
    - system:default/telco-agentic-plugins
  dependencyOf:
    - airesource:ai5-marketplace/rds-policy-update
