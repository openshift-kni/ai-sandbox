    - openshift
    - policygenerator
    - ztp
    - upgrade
  links:
    - url: https://github.com/openshift-kni/ai-sandbox
      title: Source Repository
      icon: github
spec:
  type: skill
  lifecycle: beta
  # TODO: switch to our own group once agreed with AI5.
  owner: group:redhat/ai5-marketplace
  disciplines:
    - telco
    - devops
  categories:
    - configuration-management
    - upgrades
  agents: []
  dependsOn:
