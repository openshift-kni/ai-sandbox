rubrics:
- metric: topology-preservation
  threshold: 1.0
  criteria: |
    The partner's policies define TWO MachineConfigPools: worker-1
    (the reference's source-crs/mcp-worker-1.yaml) and their own
    worker-cnf (custom-crs/mcp-worker-cnf.yaml). worker-cnf's
    PerformanceProfile is built from the reference
    source-crs/PerformanceProfile.yaml; worker-1 uses the partner's
    own real-time profile (custom-crs/PerformanceProfile-rt.yaml,
    realTimeKernel enabled). The 4.20 reference example ships three
    pools (worker-1/2/3), each with a non-real-time
    PerformanceProfile, and the 4.20 reference PerformanceProfile
    adds additionalKernelArgs: module_blacklist=irdma. The agent
    should:
    1. Keep exactly the partner's two pools (worker-1 and
       worker-cnf) and NOT add worker-2/3 from the reference's
       example topology.
    2. NOT ask the user which topology to follow — keeping the
       partner's topology is the correct, deterministic choice.
    3. Treat the partner's worker-cnf PerformanceProfile as matching
       the reference per-pool PerformanceProfile and report the
       module_blacklist=irdma change as applying to it (keeping it
       bound to worker-cnf) — NOT mark it N/A because the reference
       binds its profiles to worker-1/2/3. The partner's patch does
       not override additionalKernelArgs, so inheriting the change
       from the updated 4.20 base CR counts as applying it; it does
       not need to be added to the patch.
    4. Warn that worker-1's real-time profile matches none of the
       reference pool configurations (a deviation for the partner
       to review), while keeping it unchanged and NOT adding another
       PerformanceProfile for worker-1. Merely listing it as
       preserved custom content, without calling out the mismatch,
       does not count.
    Score 1.0 if all four hold, 0.5 if the partner's topology is
    preserved but the agent asked which to use, did not carry the
    PerformanceProfile change to worker-cnf, or did not warn about
    worker-1's deviation, 0.0 if it adopted the reference topology,
    dropped a partner pool, rebound a partner profile to another
    pool, or rewrote or replaced worker-1's profile.
manifests:
- name: subscription_channel_bumped
  cr: source-crs/SubscriptionOCP.yaml
  path: patches[].spec.channel
  contains: stable-4.20
- name: partner_profile_bound_to_partner_pool
  cr: source-crs/PerformanceProfile.yaml
  path: patches[].spec.nodeSelector
  contains: node-role.kubernetes.io/worker-cnf
- name: deviating_profile_kept
  type: exists
  cr: custom-crs/PerformanceProfile-rt.yaml
expected_pools:
- worker-1
- worker-cnf
